name: phone_note_review
description: AI-powered Obsidian note review app with spaced repetition.
publish_to: 'none'
version: 1.2.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0
  riverpod: ^2.6.0
  flutter_riverpod: ^2.6.0
  go_router: ^14.6.0
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.0
  shared_preferences: ^2.3.0
  workmanager:
    path: packages/workmanager
  flutter_local_notifications: ^18.0.0
  permission_handler: ^11.3.0
  file_picker: ^8.1.0
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0
  intl: ^0.19.0
  collection: ^1.18.0
  fl_chart: ^0.69.0
  flutter_markdown: ^0.7.6
  flutter_math_fork: ^0.7.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.22.0
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.9.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
